# Act like GNU screen
unbind C-b
set -g prefix C-a

# C-a C-a to jump to beginning of line
bind-key C-a send-prefix

# Bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind-key -n M-Tab select-pane -t :.+
bind m command-prompt "split-window -h 'exec man %%'"
bind r source-file ~/.tmux.conf
bind-key & kill-window
bind-key x kill-pane
bind-key X kill-pane -a

# Move windows to left or right
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Move window to pane
bind-key S choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

# Break pane to new window
bind-key b break-pane

# Resize panes like Vim
bind-key -r < resize-pane -L 5
bind-key -r > resize-pane -R 5
bind-key -r - resize-pane -D 5
bind-key -r + resize-pane -U 5

# Layout bindings
bind-key -r Space next-layout
bind-key = select-layout even-vertical
bind-key | select-layout even-horizontal

# Clear current window name when renaming.
bind-key , command-prompt -p (rename-window) "rename-window '%%'"

# Increase time numbers are displayed to select a pane when using `<prefix> q`.
set -g display-panes-time 5000

# Use xclip to copy to the system clipboad as well.
#bind-key -T copy-mode 'M-w' send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
# Similar but for use with Mac OS.
bind-key -T copy-mode 'M-w' send-keys -X copy-pipe-and-cancel "pbcopy"

# Alternative to M-v for virtual desktop environments where M-v doesn't work
bind-key -T copy-mode 'C-u' send-keys -X halfpage-up

# Highlight style for copy mode selection
# TODO: 'reverse' broken in tmux 3.6 - https://github.com/tmux/tmux/issues/4713
#setw -g copy-mode-selection-style 'reverse'
setw -g copy-mode-selection-style 'bg=yellow,fg=black'

# Status bar
set -g base-index 1
set -g status-style fg=white,bg=black
set -g message-style fg=white,bg=red,bright

set -g status-interval 10
set -g status-left "#[fg=white]#[bg=black] #S.#I.#P #[default]"
set -g status-right "#[fg=white]#[bg=black] %a %d %b %Y %H:%M #[default]"
set -g status-right-length 94
setw -g window-status-style bg=black
setw -g window-status-activity-style none
setw -g window-status-bell-style none
setw -g window-status-current-style fg=black,bg=white,bold
# Custom window status format to distinguish AI agent states:
#   Red    = activity (agent producing output)
#   Green  = silence (agent waiting for your input)
# Only shows badges for AI agents (opencode, or claude which shows as version e.g. 2.1.79)
# See: https://github.com/anthropics/claude-code/issues/12433
setw -g window-status-format ' #I:#W#{?#{m/r:^(opencode|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{?window_silence_flag, #[bg=green]#[fg=black] WAIT #[default],#{?window_activity_flag, #[bg=red]#[fg=black] BUSY #[default],}},} '
setw -g window-status-current-format ' #I:#W '
setw -g monitor-activity on
setw -g monitor-silence 15

# Dim inactive panes (adapts to macOS light/dark appearance)
# Uses hooks to check system theme at focus-change time and apply a
# background colour slightly shifted from the Ghostty theme:
#   Dawnfox (light) bg #faf4ed → dimmed #ede7e0
#   Terafox (dark)  bg #152528 → dimmed #1f3035
set -g focus-events on
set -g window-active-style 'fg=terminal,bg=terminal'
set-hook -g pane-focus-out "if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' 'set -p window-style dim,bg=#1f3035' 'set -p window-style dim,bg=#ede7e0'"
set-hook -g pane-focus-in 'set -p window-style default'
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=green'

# Scrollback buffer n lines
set -g history-limit 10240

# General options
set -g default-terminal tmux-256color
set -g status-keys vi
set -g bell-action none
set -g visual-bell off
set -g set-titles on
set -g set-titles-string '#S.#I.#P #W #T' # session.windowindex.paneindex windowname windowtitle
set -g renumber-windows on  # renumber windows sequentially after closing any of them

# Scrolling with Shift-PageUp/Shift-PageDown
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# No time between C-a and command
set -sg escape-time 0

# Window options
setw -g mode-keys emacs
setw -g aggressive-resize on

# Disable auto renaming
setw -g automatic-rename off
setw -g alternate-screen on
